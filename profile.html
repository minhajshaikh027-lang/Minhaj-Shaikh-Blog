<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Minhaj Shaikh Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="page">
  <section class="profile-dashboard">
    <div class="dashboard-head">
      <div class="mini-avatar" id="profile-avatar">M</div>
      <div><span class="eyebrow">YOUR PROFILE</span><h1 id="profile-name">Welcome</h1><p id="profile-email"></p></div>
    </div>
    <div class="dashboard-grid">
      <div class="stat-card"><span>❤️</span><strong id="liked-count">0</strong><p>Liked posts</p></div>
      <div class="stat-card"><span>💬</span><strong id="comment-count">0</strong><p>Comments</p></div>
      <div class="stat-card"><span>🔖</span><strong id="saved-count">0</strong><p>Saved posts</p></div>
    </div>
    <button id="dashboard-logout" class="btn btn-ghost">Logout</button>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/script.js"></script><script src="js/auth.js"></script>
</body>
</html>
