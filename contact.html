<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Minhaj Shaikh Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="page">
  <section class="page-title">
    <span class="eyebrow">LET’S CONNECT</span>
    <h1>Have something to say?</h1>
    <p>Send a message, project idea or simply say hello.</p>
  </section>
  <section class="contact-layout">
    <div class="contact-info">
      <div class="contact-card"><span>📧</span><h3>Email</h3><p>minhajshaikh@027gmail.com</p></div>
      <div class="contact-card"><span>📍</span><h3>Location</h3><p>Surat, Gujarat, India</p></div>
      <div class="contact-card"><span>🎥</span><h3>Creator</h3><p>Minhaj Shaikh Vlogs</p></div>
      <div class="contact-card"><span>📸</span><h3>Instagram</h3><p><a href="https://www.instagram.com/itz_minhajshaikh.18/" target="_blank" rel="noopener">@itz_minhajshaikh.18</a></p></div>
    </div>
    <form id="contact-form" class="form-card">
      <label>Name<input id="contact-name" type="text" required></label>
      <label>Email<input id="contact-email" type="email" required></label>
      <label>Subject<input id="contact-subject" type="text" required></label>
      <label>Message<textarea id="contact-message" rows="7" required></textarea></label>
      <button class="btn btn-primary" type="submit">Send message</button>
      <p id="contact-status" class="form-status"></p>
    </form>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/script.js"></script>
</body>
</html>
